<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Ordis Nexus</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand">ORDIS <span>NEXUS</span></div><nav id="tabs"></nav><div id="pill" class="pill"></div></header>
<main id="view">Starting Ordis Nexus…</main>
<script>
window.addEventListener('error', function (e) { var v = document.getElementById('view'); if (v) v.textContent = 'Ordis Nexus error: ' + (e.message || e) + ' (' + (e.filename || '') + ':' + (e.lineno || '') + ')'; });
window.addEventListener('unhandledrejection', function (e) { var v = document.getElementById('view'); if (v) v.textContent = 'Ordis Nexus error: ' + ((e.reason && e.reason.message) || e.reason); });
</script>
<script type="module" src="main.js"></script>
</body></html>
