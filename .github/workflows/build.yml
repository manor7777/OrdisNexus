name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release 2>&1
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ordis-nexus.exe dist/OrdisNexus.exe
          Compress-Archive -Path dist/OrdisNexus.exe -DestinationPath dist/OrdisNexus-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OrdisNexus-windows-x64
          path: dist/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/OrdisNexus.exe
            dist/OrdisNexus-windows-x64.zip
