name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version / build number
        shell: pwsh
        run: |
          $v = (Select-String '^version = "(.*)"' Cargo.toml | Select-Object -First 1).Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not "${{ github.ref }}".StartsWith("refs/tags/")) {
            "APP_BUILD=${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Test
        run: cargo test --release 2>&1
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ordis-nexus.exe dist/OrdisNexus.exe
          Compress-Archive -Path dist/OrdisNexus.exe -DestinationPath dist/OrdisNexus-windows-x64.zip -Force
          Compress-Archive -Path overwolf/ordis-bridge/* -DestinationPath dist/OrdisNexusBridge.zip -Force
          Move-Item dist/OrdisNexusBridge.zip dist/OrdisNexusBridge.opk -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OrdisNexus-windows-x64
          path: dist/*
      - name: Publish GitHub release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', env.VERSION, github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/OrdisNexus.exe
            dist/OrdisNexus-windows-x64.zip
            dist/OrdisNexusBridge.opk
