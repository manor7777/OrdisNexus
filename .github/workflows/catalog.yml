name: Catalog
on: workflow_dispatch
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/gen_catalog.py --fetch
      - run: python scripts/inspect_catalog.py
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add assets/catalog.json.gz
          git diff --cached --quiet || (git commit -m "Refresh item catalog" && git push)
